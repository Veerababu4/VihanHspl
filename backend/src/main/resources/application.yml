# Shared settings. Secrets and environment-specific values come from backend/.env
# (git-ignored; copy .env.example). Switching local -> cloud = change .env only.
spring:
  application:
    name: vihan-hospital
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      pool-name: vihan-pool
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; Hibernate only checks it
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Kolkata
          fetch_size: 100
        # Booleans are NUMBER(1) 0/1 (DESIGN.md §9.1) so one schema works on Oracle 19c and 23ai+.
        # Without this, Hibernate expects Oracle 23's native BOOLEAN type.
        type:
          preferred_boolean_jdbc_type: BIT
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    path: /swagger-ui

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"

app:
  sample-data: false
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
