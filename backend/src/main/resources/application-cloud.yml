# Free-hosting deployment: Oracle Autonomous DB (wallet / TLS), no sample data, Swagger off.
spring:
  datasource:
    hikari:
      maximum-pool-size: 5    # Always Free ADB has a low session limit

server:
  # Only Caddy on the same VM can reach the app, so the X-Forwarded-* headers it sets can be trusted.
  address: ${SERVER_ADDRESS:127.0.0.1}
  forward-headers-strategy: framework   # behind Caddy reverse proxy

logging:
  file:
    name: ${LOG_FILE:logs/vihan-hospital.log}
  logback:
    rollingpolicy:
      max-history: 30
